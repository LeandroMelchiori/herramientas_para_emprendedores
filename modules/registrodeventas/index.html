<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registro de Ventas — Herramientas para Emprendedores</title>
<meta name="description" content="Registrá tus ventas y controlá ingresos, costos y ganancias en tiempo real.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#D5306E">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="/pwa.js" defer></script>
<script src="/analytics.js" defer></script>
<script src="/shared/storage.js" defer></script>
<script src="/shared/format.js" defer></script>
<script src="/backup.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="/modules/registrodeventas/app.js" defer></script>
<script src="/modules/registrodeventas/history.js" defer></script>
<script src="/modules/registrodeventas/pdf.js" defer></script>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/modules/registrodeventas/styles.css">
</head>
<body>

<header class="header">
  <div class="header-top">
    <a href="/" class="btn-volver">← Volver</a>
    <span class="header-title">Registro de ventas</span>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="goTo(0)">Nueva venta</button>
    <button class="nav-tab" onclick="goTo(1)">Historial</button>
  </nav>
</header>

<!-- ══ PÁGINA 0: NUEVA VENTA ══ -->
<div class="page active" id="page-0">

  <!-- Selector de producto -->
  <div class="card">
    <div class="card-title">Agregar al carrito</div>

    <div class="field-group">
      <label for="select-producto">Producto</label>
      <select id="select-producto" onchange="seleccionarProducto()">
        <option value="">— Elegí un producto —</option>
      </select>
    </div>

    <div class="producto-preview" id="producto-preview">
      <span class="preview-precio" id="preview-precio"></span>
      &nbsp;·&nbsp;
      <span class="preview-costo" id="preview-costo"></span>
    </div>

    <div class="field-group">
      <label for="input-cantidad">Cantidad</label>
      <input type="number" id="input-cantidad" value="1" min="1" step="1">
    </div>

    <button class="btn-agregar" id="btn-agregar" onclick="agregarAlCarrito()" disabled>
      + Agregar al carrito
    </button>
  </div>

  <!-- Carrito -->
  <div class="card">
    <div class="card-title">Carrito</div>
    <div id="lista-carrito">
      <div class="carrito-vacio">Todavía no agregaste productos</div>
    </div>
  </div>

  <!-- Resumen y precio final (se muestra cuando hay items) -->
  <div class="card" id="card-totales" style="display:none">
    <div class="card-title">Resumen de la venta</div>

    <!-- Desglose sugerido -->
    <div class="totales-box" id="totales-box"></div>

    <div class="field-group">
      <label for="input-etiqueta">Etiqueta / Nombre del cliente (opcional)</label>
      <input type="text" id="input-etiqueta" placeholder="Ej: Jorge, Seña...">
    </div>
    <div class="field-group" style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1">
        <label for="select-pago">Medio de pago</label>
        <select id="select-pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--gris-texto);font-weight:600;cursor:pointer;margin-top:18px;">
        <input type="checkbox" id="check-fiado" onchange="toggleSena()" style="width:18px;height:18px;accent-color:var(--naranja)">
        Falta pagar
      </label>
      <div id="div-sena" style="display:none;margin-top:12px;">
        <label style="display:block;font-size:0.75rem;color:var(--gris-texto);font-weight:600;margin-bottom:4px;">¿Dejó seña? (Opcional)</label>
        <input type="number" id="input-sena" placeholder="Monto abonado ahora" style="width:100%;padding:10px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;">
      </div>
    </div>

    <!-- Campo de precio final editable -->
    <div class="precio-final-wrap">
      <span class="precio-final-label">Precio final cobrado</span>
      <div class="precio-final-input-wrap">
        <input type="number" id="input-precio-final" min="0" step="1"
          oninput="onPrecioFinalInput()">
        <span class="descuento-badge" id="badge-descuento"></span>
      </div>
    </div>

    <!-- Desglose costo / ganancia real -->
    <div class="desglose" id="desglose-venta"></div>

    <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarVenta()" disabled>
      ✓ Registrar venta
    </button>
  </div>

</div>

<!-- ══ PÁGINA 1: HISTORIAL ══ -->
<div class="page" id="page-1">

  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <button onclick="exportarBackupCompleto()"
      style="flex:1;background:var(--naranja-palido);color:var(--naranja);border:1.5px solid var(--naranja-claro);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px;cursor:pointer;">
      🔒 Hacer backup
    </button>
    <label
      style="flex:1;background:var(--gris);color:var(--gris-texto);border:1.5px solid var(--borde);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px;cursor:pointer;text-align:center;">
      ⬆ Restaurar
      <input type="file" accept=".json" onchange="restaurarBackup(event)" style="display:none;">
    </label>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <select id="select-mes-pdf"
      style="flex:1;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;background:var(--fondo);color:var(--texto);">
      <option value="todo">Todo el historial</option>
    </select>
    <button onclick="generarPDFVentas()"
      style="background:var(--azul-palido);color:var(--azul);border:1.5px solid #BFDBFE;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap;">
      📄 PDF
    </button>
  </div>

  <div class="filtros-periodo">
    <button class="btn-filtro active" onclick="setFiltro('hoy', this)">Hoy</button>
    <button class="btn-filtro" onclick="setFiltro('semana', this)">Esta semana</button>
    <button class="btn-filtro" onclick="setFiltro('mes', this)">Este mes</button>
    <button class="btn-filtro" onclick="setFiltro('todo', this)">Todo</button>
  </div>

  <div style="margin-bottom:14px;">
    <select id="filtro-estado-pago" onchange="renderizarHistorial()"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;background:var(--fondo);color:var(--texto);font-weight:600;">
      <option value="todas">Mostrar todas las ventas</option>
      <option value="pendientes">Mostrar solo "Falta pagar"</option>
    </select>
  </div>

  <div class="resumen-periodo" id="resumen-periodo"></div>

  <div id="lista-historial"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

</body>
</html>
