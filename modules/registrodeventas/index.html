<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registro de Ventas â€” Herramientas para Emprendedores</title>
<meta name="description" content="RegistrÃ¡ tus ventas y controlÃ¡ ingresos, costos y ganancias en tiempo real.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#D5306E">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="/pwa.js" defer></script>
<script src="/analytics.js" defer></script>
<script src="/shared/migrations.js" defer></script>
<script src="/shared/storage.js" defer></script>
<script src="/shared/format.js" defer></script>
<script src="/shared/ui.js" defer></script>
<script src="/shared/costing.js" defer></script>
<script src="/backup.js" defer></script>
<script src="/modules/registrodeventas/sales-domain.js" defer></script>
<script src="/modules/registrodeventas/cart-state.js" defer></script>
<script src="/modules/registrodeventas/dashboard.js" defer></script>
<script src="/modules/registrodeventas/expenses-domain.js" defer></script>
<script src="/modules/registrodeventas/closures-domain.js" defer></script>
<script src="/modules/registrodeventas/expenses.js" defer></script>
<script src="/modules/registrodeventas/closures.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="/modules/registrodeventas/app.js" defer></script>
<script src="/modules/registrodeventas/history.js" defer></script>
<script src="/modules/registrodeventas/dashboard-view.js" defer></script>
<script src="/modules/registrodeventas/pdf.js" defer></script>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/modules/registrodeventas/styles.css">
<link rel="stylesheet" href="/modules/registrodeventas/history.css">
</head>
<body>

<header class="header">
  <div class="header-top">
    <a href="/" class="btn-volver">â† Volver</a>
    <span class="header-title">Registro de ventas</span>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-action="navigate" data-page="0">Nueva venta</button>
    <button class="nav-tab" data-action="navigate" data-page="1">Historial</button>
    <button class="nav-tab" data-action="navigate" data-page="2">Gastos</button>
  </nav>
</header>

<!-- â•â• PÃGINA 0: NUEVA VENTA â•â• -->
<div class="page active" id="page-0">

  <!-- Selector de producto -->
  <div class="card">
    <div class="card-title">Agregar al carrito</div>

    <div class="field-group">
      <label for="select-producto">Producto</label>
      <select id="select-producto">
        <option value="">â€” ElegÃ­ un producto â€”</option>
      </select>
    </div>

    <div class="producto-preview" id="producto-preview">
      <span class="preview-precio" id="preview-precio"></span>
      &nbsp;Â·&nbsp;
      <span class="preview-costo" id="preview-costo"></span>
    </div>

    <div class="field-group">
      <label for="input-cantidad">Cantidad</label>
      <input type="number" id="input-cantidad" value="1" min="1" step="1">
    </div>

    <button class="btn-agregar" id="btn-agregar" disabled>
      + Agregar al carrito
    </button>
  </div>

  <!-- Carrito -->
  <div class="card">
    <div class="card-title">Carrito</div>
    <div id="lista-carrito">
      <div class="carrito-vacio">TodavÃ­a no agregaste productos</div>
    </div>
  </div>

  <!-- Resumen y precio final (se muestra cuando hay items) -->
  <div class="card" id="card-totales" style="display:none">
    <div class="card-title">Resumen de la venta</div>

    <!-- Desglose sugerido -->
    <div class="totales-box" id="totales-box"></div>

    <div class="field-group">
      <label for="input-etiqueta">Etiqueta / Nombre del cliente (opcional)</label>
      <input type="text" id="input-etiqueta" placeholder="Ej: Jorge, SeÃ±a...">
    </div>
    <div class="field-group" style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1">
        <label for="select-pago">Medio de pago</label>
        <select id="select-pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--gris-texto);font-weight:600;cursor:pointer;margin-top:18px;">
        <input type="checkbox" id="check-fiado" style="width:18px;height:18px;accent-color:var(--naranja)">
        Falta pagar
      </label>
      <div id="div-sena" style="display:none;margin-top:12px;">
        <label style="display:block;font-size:0.75rem;color:var(--gris-texto);font-weight:600;margin-bottom:4px;">Â¿DejÃ³ seÃ±a? (Opcional)</label>
        <input type="number" id="input-sena" placeholder="Monto abonado ahora" style="width:100%;padding:10px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;">
      </div>
    </div>

    <!-- Campo de precio final editable -->
    <div class="precio-final-wrap">
      <span class="precio-final-label">Precio final cobrado</span>
      <div class="precio-final-input-wrap">
        <input type="number" id="input-precio-final" min="0" step="1">
        <span class="descuento-badge" id="badge-descuento"></span>
      </div>
    </div>

    <!-- Desglose costo / ganancia real -->
    <div class="desglose" id="desglose-venta"></div>

    <button class="btn-finalizar" id="btn-finalizar" disabled>
      âœ“ Registrar venta
    </button>
  </div>

</div>

<!-- â•â• PÃGINA 1: HISTORIAL â•â• -->
<div class="page" id="page-1">

  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <button id="btn-backup"
      style="flex:1;background:var(--naranja-palido);color:var(--naranja);border:1.5px solid var(--naranja-claro);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px;cursor:pointer;">
      ðŸ”’ Hacer backup
    </button>
    <label
      style="flex:1;background:var(--gris);color:var(--gris-texto);border:1.5px solid var(--borde);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px;cursor:pointer;text-align:center;">
      â¬† Restaurar
      <input type="file" accept=".json" id="input-restaurar" style="display:none;">
    </label>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <select id="select-mes-pdf"
      style="flex:1;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;background:var(--fondo);color:var(--texto);">
      <option value="todo">Todo el historial</option>
    </select>
    <button id="btn-pdf"
      style="background:var(--azul-palido);color:var(--azul);border:1.5px solid #BFDBFE;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap;">
      ðŸ“„ PDF
    </button>
  </div>

  <section class="monthly-panel" aria-labelledby="monthly-title">
    <div class="monthly-head">
      <div><span class="monthly-kicker">Resumen mensual</span><h2 id="monthly-title">Tu negocio en n&uacute;meros</h2></div>
      <select id="select-mes-panel" aria-label="Mes del resumen"></select>
    </div>
    <div id="panel-mensual"></div>
  </section>

  <div class="filtros-periodo">
    <button class="btn-filtro active" data-action="filter-period" data-period="hoy">Hoy</button>
    <button class="btn-filtro" data-action="filter-period" data-period="semana">Esta semana</button>
    <button class="btn-filtro" data-action="filter-period" data-period="mes">Este mes</button>
    <button class="btn-filtro" data-action="filter-period" data-period="todo">Todo</button>
  </div>

  <div style="margin-bottom:14px;">
    <select id="filtro-estado-pago"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:0.85rem;font-family:'DM Sans',sans-serif;background:var(--fondo);color:var(--texto);font-weight:600;">
      <option value="todas">Mostrar todas las ventas</option>
      <option value="pendientes">Mostrar solo "Falta pagar"</option>
    </select>
  </div>

  <div class="resumen-periodo" id="resumen-periodo"></div>

  <div id="lista-historial"></div>

</div>

<!-- PAGINA 2: GASTOS -->
<div class="page" id="page-2">
  <form class="card expense-form" id="form-gasto">
    <div class="card-title">Registrar gasto real</div>
    <div class="expense-form-grid">
      <div class="field-group expense-concept"><label for="gasto-concepto">Concepto</label><input id="gasto-concepto" required maxlength="100" placeholder="Ej: Alquiler del puesto"></div>
      <div class="field-group"><label for="gasto-monto">Monto</label><input id="gasto-monto" type="number" min="0.01" step="0.01" required></div>
      <div class="field-group"><label for="gasto-fecha">Fecha</label><input id="gasto-fecha" type="date" required></div>
      <div class="field-group"><label for="gasto-categoria">Categor&iacute;a</label><select id="gasto-categoria"><option>Insumos</option><option>Servicios</option><option>Transporte</option><option>Alquiler</option><option>Impuestos</option><option>Marketing</option><option>Equipamiento</option><option>Otros</option></select></div>
      <div class="field-group"><label for="gasto-medio">Medio de pago</label><select id="gasto-medio"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></div>
      <label class="expense-repeat"><input id="gasto-recurrente" type="checkbox"> Repetir autom&aacute;ticamente cada mes</label>
    </div>
    <button class="btn-finalizar" type="submit">Registrar gasto</button>
  </form>
  <div class="expense-toolbar"><select id="select-mes-gastos" aria-label="Mes de gastos"></select><div id="gastos-total"></div></div>
  <div id="lista-gastos"></div>
</div>

<div class="modal-backdrop" id="modal-anular" hidden>
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="anular-title">
    <h2 id="anular-title">Anular venta</h2>
    <p>La operaci&oacute;n quedar&aacute; en el historial, pero no contar&aacute; en los informes.</p>
    <label for="anular-motivo">Motivo</label>
    <textarea id="anular-motivo" rows="3" maxlength="180" placeholder="Ej: El cliente cancel&oacute; la compra"></textarea>
    <input type="hidden" id="anular-id">
    <div class="modal-actions"><button type="button" class="secondary" data-action="cancel-annul">Cancelar</button><button type="button" data-action="confirm-annul">Confirmar anulaci&oacute;n</button></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

</body>
</html>
